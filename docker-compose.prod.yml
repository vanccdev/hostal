name: hostal-nextjs-prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

      # Public values used by the browser and embedded during the build.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

      # Server-only values. Configure them as runtime variables in Dokploy.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      CRON_SECRET: ${CRON_SECRET}
      WEBHOOK_RESERVAS_URL: ${WEBHOOK_RESERVAS_URL}
      WEBHOOK_PAGOS_URL: ${WEBHOOK_PAGOS_URL}
      WEBHOOK_AUTH_EVENTS_URL: ${WEBHOOK_AUTH_EVENTS_URL}
    expose:
      - "3000"
    restart: unless-stopped
